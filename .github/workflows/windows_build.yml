---
name: Build Windows

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}

jobs:
  build:
    name: CMake on Windows

    strategy:
      fail-fast: false
      matrix:
        make_flags: ["",
                     "USE_SYSTEM_MINIZIP=ON",
                     "BUILD_SHARED_LIBS=ON"]
        build_type : [Debug, Release]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        pip install pytest

    - name: Configure CMake
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        mkdir build
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake .. -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build . --config ${{ matrix.build_type }}

    - name: Test
      run: |
        cd build
        pytest -v test/functional
