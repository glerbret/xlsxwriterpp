---
name: Build Linux

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}

jobs:
  build:
    name:
      Cmake
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        make_flags: ["",
                     "-DUSE_SYSTEM_MINIZIP=ON",
                     "-DBUILD_SHARED_LIBS=ON"]

    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.cxx }}
      CC: |-
        ${{ case(
          matrix.cxx == 'g++', 'gcc',
          matrix.cxx == 'clang++', 'clang',
          'gcc'
        ) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get -y install libboost-dev libboost-test-dev
        sudo apt-get -y install zlib1g-dev
        sudo apt-get -y install libminizip-dev
        sudo apt-get -y install python3-pytest

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Test
      run: |
        cd build
        for f in test/unit/*; do ./$f; done
        pytest -v test/functional
