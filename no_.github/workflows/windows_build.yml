---
name: Test Cmake build on Windows

on: [push, pull_request]

jobs:
  build:
    name: CMake on Windows

    strategy:
      fail-fast: false
      matrix:
        cmake_flags: ["-DBUILD_EXAMPLES=ON",
###                      "-DUSE_DTOA_LIBRARY=ON",
                      "-DUSE_SYSTEM_MINIZIP=ON",
###                      "-DUSE_SYSTEM_MINIZIP=ON   -DUSE_OPENSSL_MD5=ON",
###                      "-DUSE_OPENSSL_MD5=ON",
                      ]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        vcpkg.exe install zlib:x64-windows minizip:x64-windows openssl:x64-windows
        vcpkg.exe integrate install

    - name: Configure CMake
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        mkdir build
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake .. -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }} -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build . --config Release
