---
name: Test Cmake build on Windows

on: [push, pull_request]
permissions: {}

jobs:
  build:
    name: CMake on Windows

    strategy:
      fail-fast: false

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        vcpkg.exe install zlib:x64-windows minizip:x64-windows openssl:x64-windows boost:x64-windows
        vcpkg.exe integrate install
        pip install pytest

    - name: Configure CMake
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        mkdir build
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake .. -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        cd build
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build . --config Release

    - name: Test
      run: |
        cd build
        pytest -v test/functional
