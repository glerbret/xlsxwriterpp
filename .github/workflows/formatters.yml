---
name: Formatters

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}

jobs:
  Clang-format:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get -y install clang-format

    - name: Run clang-format
      run: |
        clang-format --version
        clang-format $(find . -name *.cpp -o -name *.h | grep -v CompilerId | grep -v third_party)  --dry-run --Werror

  Autopep:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get -y install python3 python3-pip python3-autopep8

    - name: Run autopep8
      run: |
        autopep8 --version
        autopep8 $(find -name *.py) --diff --exit-code
